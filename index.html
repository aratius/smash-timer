<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマッシュ・タイマー</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スマッシュ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<style>
:root{--bg:#0a1511;--card:#12211b;--card2:#1b2f27;--line:rgba(242,239,228,.09);--tx:#f2efe4;--mut:#93aa9f;
--work:#ff6b35;--rest:#5fd4a4;--prep:#9ccfff;--sw:#ffd166;--light:#d8c9a8;--acc:#ff6b35;--day:#c0eb75;--ink:#0a1511;
--num:"DIN Alternate","Avenir Next Condensed","Bahnschrift","Roboto Condensed","sans-serif-condensed",system-ui,sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
--court:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 240' fill='none' stroke='%23f2efe4' stroke-width='2'><rect x='10' y='10' width='180' height='220'/><line x1='24' y1='10' x2='24' y2='230'/><line x1='176' y1='10' x2='176' y2='230'/><line x1='10' y1='60' x2='190' y2='60'/><line x1='10' y1='214' x2='190' y2='214'/><line x1='100' y1='60' x2='100' y2='230'/><line x1='0' y1='10' x2='200' y2='10' stroke-width='5'/></svg>")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overscroll-behavior:none;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;
-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;line-break:strict;word-break:auto-phrase;text-wrap:pretty;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,.ringw:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
@media (hover:hover){.day:hover,.row:hover,.seg button:hover,.lv button:hover,.pk:hover,.iconbtn:hover{filter:brightness(1.18)}.go:hover{filter:brightness(1.07)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) calc(16px + var(--sar)) calc(var(--sab) + 130px) calc(16px + var(--sal))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.12em;font-size:19px;font-family:var(--num)}
.logo b{font-weight:600}
.logo svg{width:26px;height:26px}
.logo b{color:var(--acc);font-weight:800}
.tb{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;color:var(--mut)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{position:relative;height:60px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mut);font-weight:700;transition:background .15s,color .15s}
.day span{font-size:18px;line-height:1}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.today{box-shadow:inset 0 -2px 0 var(--mut)}.day[aria-pressed=true].today{box-shadow:0 8px 22px -10px var(--tx),inset 0 -3px 0 var(--ink)}.day.today i{background:var(--mut)}
.day.done i{background:var(--rest)}
.day[aria-pressed=true]{background:var(--tx);color:var(--ink);box-shadow:0 8px 22px -10px var(--tx)}
.day[aria-pressed=true].today i{background:var(--ink)}
.day[aria-pressed=true].done i{background:#0d8f66}
.theme{border-radius:22px;padding:18px 18px 16px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;isolation:isolate}
.theme::before{content:"";position:absolute;right:-14px;top:-8px;width:120px;height:144px;background:var(--court) center/contain no-repeat;opacity:.11;z-index:-1}
.theme::after{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 3px 3px 0;background:var(--day)}
.theme .k{font-size:13px;color:var(--mut);font-weight:700}
.theme .t{font-size:25px;font-weight:800;margin:2px 0 6px;letter-spacing:.01em}
.theme .n,.theme .g{max-width:calc(100% - 84px)}.theme .n{font-size:14px;color:var(--mut);line-height:1.6}
.theme .g{margin-top:8px;font-size:13px;color:var(--tx);opacity:.85}
.sec{font-size:13px;color:var(--mut);font-weight:700;margin:20px 2px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:60px;border-radius:18px;background:var(--card);font-weight:800;font-size:17px;border:2px solid transparent;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.seg button small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:1px}
.seg button[aria-pressed=true],.lv button[aria-pressed=true]{border-color:var(--acc);background:#1f3a2e}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv button{border-radius:18px;background:var(--card);padding:12px 6px 11px;border:2px solid transparent;transition:.15s}
.lv button .l{font-size:30px;font-weight:800;line-height:1.1}
.lv button .m{font-size:13px;color:var(--mut);font-weight:600;margin-top:3px;font-family:var(--num);letter-spacing:.02em}
.lv button[aria-pressed=true] .m{color:var(--tx)}
.grp{margin-top:16px}
.grp h4{margin:0 0 6px 4px;font-size:14px;color:var(--tx);display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.grp h4 em{font-style:normal;color:var(--mut);font-weight:500;font-size:13px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:6px;width:100%;text-align:left;min-height:56px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:16px;font-weight:700}
.row .nm span{font-size:13px;color:var(--mut)}
.row .st{font-size:14px;font-weight:700;background:var(--card2);padding:5px 11px;border-radius:11px;white-space:nowrap;font-family:var(--num)}
.row .q{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--mut);display:grid;place-items:center;font-size:14px;font-weight:700}
.row.plain{background:rgba(242,239,228,.03);border:1px solid var(--line);min-height:0;display:block}
.row.plain span{display:block;line-height:1.6;font-size:13px;color:var(--mut)}
.picks{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px 2px}
.pk{height:44px;padding:0 14px;border-radius:20px;background:var(--card);font-weight:700;font-size:14px;border:2px solid transparent;color:var(--mut)}
.pk[aria-pressed=true]{border-color:var(--acc);color:var(--tx);background:#1f3a2e}
.empty{margin-top:18px;background:var(--card);border-radius:18px;padding:18px;text-align:center;line-height:1.7;color:var(--mut)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.note{font-size:13.5px;color:var(--mut);background:var(--card);border-radius:16px;padding:12px 14px;line-height:1.7;margin-top:10px}
.week{white-space:pre-line;line-height:1.7;margin:20px 2px 0;font-size:13px;color:var(--mut)}
.resume{background:#1f3a2e;border:1px solid rgba(95,212,164,.35);border-radius:20px;padding:14px;margin-bottom:12px}
.resume b{font-size:15px}.resume p{margin:4px 0 10px;color:var(--mut);font-size:13.5px}
.resume .two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.startbar{position:fixed;left:0;right:0;bottom:0;padding:44px calc(16px + var(--sar)) calc(var(--sab) + 14px) calc(16px + var(--sal));background:linear-gradient(transparent,var(--bg) 58%);pointer-events:none}
.go{pointer-events:auto;width:100%;height:64px;border-radius:22px;background:var(--acc);color:var(--ink);font-weight:800;font-size:20px;letter-spacing:.04em;box-shadow:0 12px 30px -10px var(--acc);display:flex;align-items:center;justify-content:center;gap:10px}
.go svg{width:22px;height:22px;fill:var(--ink)}
.go small{font-weight:700;opacity:.75;font-size:15px;font-family:var(--num)}
.go:active{transform:scale(.98)}
.go[disabled]{background:var(--card2);color:var(--mut);box-shadow:none}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 92px);background:var(--tx);color:var(--ink);border-radius:16px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;z-index:30}
.toast.on{display:flex}
.toast button{background:var(--ink);color:var(--tx);border-radius:12px;padding:8px 14px;font-weight:700}

/* ---------- Run ---------- */
#run{--pc:var(--prep);--pbg:rgba(156,207,255,.20);background:radial-gradient(130% 62% at 50% -6%,var(--pbg),transparent 62%),var(--bg);transition:background .35s;overflow:hidden}
#run::before{content:"";position:absolute;inset:0;background:var(--court) 50% 30%/150% auto no-repeat;opacity:0;pointer-events:none}
#run[data-phase=work]{--pc:var(--work);--pbg:rgba(255,107,53,.30)}
#run[data-phase=rest]{--pc:var(--rest);--pbg:rgba(95,212,164,.24)}
#run[data-phase=switch]{--pc:var(--sw);--pbg:rgba(255,209,102,.26)}
#run[data-phase=light]{--pc:var(--light);--pbg:rgba(216,201,168,.22)}
#run[data-phase=paused]{--pc:#7b8a83;--pbg:rgba(123,138,131,.16)}
#run>*{position:relative}
@keyframes flash{0%{opacity:.14}100%{opacity:0}}
#run.flash::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--pc);opacity:0;animation:flash .4s ease-out;z-index:5}
.rtop{padding:calc(var(--sat) + 10px) calc(14px + var(--sar)) 0 calc(14px + var(--sal));display:flex;align-items:center;gap:10px}
.rtop .prog{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:rgba(242,239,228,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pc);border-radius:3px;transition:width .2s linear}
.rtop .tm{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:14px;color:var(--mut);margin-top:6px;font-family:var(--num);letter-spacing:.02em}
.rtop .tm span:nth-child(2){font-family:inherit;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center;font-size:13px}.rtop .tm span{flex:none}.rtop .tm span:nth-child(2){flex:1}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:0 16px;min-height:0;text-align:center}
.pill{display:inline-block;padding:7px 24px;border-radius:999px;background:var(--pc);color:var(--ink);font-weight:800;font-size:20px;letter-spacing:.08em;transition:background .3s}
.exn{font-size:clamp(26px,7.6vw,38px);font-weight:800;line-height:1.2;max-width:100%;text-wrap:balance}
.setinfo{margin-top:6px;font-size:20px;color:var(--tx);font-weight:700;display:flex;flex-direction:column;gap:4px;align-items:center}
.exn{min-height:2.4em;display:flex;align-items:center;justify-content:center}.setinfo{min-height:62px}.setinfo.compact{min-height:0}.setinfo.compact .r1{display:none}.setinfo .r1{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:22px}
.setinfo .xi{font-size:14px;color:var(--mut);font-weight:600}
.side{display:inline-block;line-height:1.3;font-size:22px;background:var(--card2);color:var(--tx);border:2px solid var(--pc);padding:1px 14px;border-radius:12px;font-weight:800}
.side[hidden]{display:none}
.ringw{position:relative;width:min(86vw,44vh);aspect-ratio:1;container-type:size;cursor:pointer}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ringw .trk{stroke:rgba(242,239,228,.09)}
.ringw .pg{stroke:var(--pc);stroke-linecap:round;transition:stroke .3s,stroke-dashoffset .1s linear}
.digits{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.digits b{font-family:var(--num);font-size:min(30vw,15vh);font-size:38cqw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.digits b.long{font-size:27cqw}
.digits small{font-size:17px;color:rgba(242,239,228,.86);font-weight:600;margin-top:6px;max-width:76%;line-height:1.4}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
.next{width:100%;max-width:440px;background:rgba(242,239,228,.07);border-radius:18px;padding:11px 16px;display:flex;gap:12px;align-items:center;text-align:left}
.next em{font-style:normal;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--mut)}
.next b{font-size:16px;font-weight:700}
.xrow{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;min-height:52px;padding:0 14px 8px}
.chip{height:44px;padding:0 16px;border-radius:22px;background:rgba(242,239,228,.09);font-weight:700;font-size:15px}
.chip[hidden]{display:none}
.ctrl{display:flex;align-items:center;justify-content:center;gap:26px;padding:4px 16px calc(var(--sab) + 14px)}
.cb{width:60px;height:60px;border-radius:50%;background:rgba(242,239,228,.09);display:grid;place-items:center}
.cb svg{width:26px;height:26px;fill:var(--tx)}
.cb.main{width:88px;height:88px;background:var(--pc);transition:background .3s}
.cb.main svg{width:36px;height:36px;fill:var(--ink)}
.cb:active{transform:scale(.94)}
@media (max-height:660px){.rmid{justify-content:space-around}.pill{font-size:17px;padding:5px 20px}.setinfo{font-size:17px;margin-top:2px}.ringw{width:min(78vw,40vh)}.digits small{font-size:14px}.next{padding:7px 14px}.next b{font-size:14px}.cb.main{width:76px;height:76px}.cb{width:52px;height:52px}.xrow{padding-bottom:4px}}

/* ---------- Done ---------- */
#done{align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(120% 60% at 50% 0%,rgba(95,212,164,.22),transparent 60%),var(--bg);overflow-y:auto}
#done.zero .stats{display:none}
#done .sh{width:108px;height:108px;animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
#done h1{font-size:32px;margin:10px 0 4px;font-weight:800}
#done p{color:var(--mut);margin:0 0 18px;font-size:15px}
.stats{display:flex;gap:10px;width:100%;max-width:420px;margin-bottom:16px}
.stats div{flex:1;text-align:center;background:var(--card2);border-radius:18px;padding:14px 4px}
.stats b{display:block;font-size:34px;font-weight:700;font-family:var(--num)}
.stats span{font-size:13px;color:var(--mut);font-weight:600}
.wk{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.wk div{width:34px;text-align:center;font-size:12px;color:var(--mut)}
.wk div i{display:block;width:26px;height:26px;border-radius:50%;background:var(--card);margin:0 auto 4px;display:grid;place-items:center}
.wk div.on i{background:var(--rest)}
.wk div.on i::after{content:"";width:10px;height:6px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.rpe{width:100%;max-width:420px;margin-bottom:18px}
.rpe p{margin:0 0 8px;font-size:14px}
.rpe .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rpe button{height:48px;border-radius:14px;background:var(--card);font-weight:700;font-size:15px;border:2px solid transparent}
.rpe button[aria-pressed=true]{border-color:var(--acc);background:#1f3a2e}

/* ---------- Sheets ---------- */
.back{position:fixed;inset:0;background:rgba(5,10,8,.6);opacity:0;pointer-events:none;transition:.25s;z-index:20}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;background:var(--card);border-radius:26px 26px 0 0;z-index:21;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sab);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(242,239,228,.26);margin:9px auto 0}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;touch-action:none}
.sheet .hd b{font-size:18px;font-weight:800}
.sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 22px}
.live{font-family:var(--num);font-weight:700;font-size:16px;background:var(--work);color:var(--ink);border-radius:10px;padding:3px 10px;margin-right:8px}
.live[hidden]{display:none}
.paper{background:#e9eee9;color:#212529;border-radius:18px;padding:10px 10px 6px;margin-bottom:6px;-webkit-user-select:text;user-select:text}
.figs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.figs>div{flex:0 0 72%;text-align:center;scroll-snap-align:start}
.figs.one>div{flex-basis:72%;margin:0 auto}
.figs svg{width:100%;height:auto;display:block}
.figs .cap{font-size:12px;line-height:1.4;color:#343a40;padding:0 2px 4px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(242,239,228,.2)}
.dots i.on{background:var(--tx)}
.dt h5{margin:16px 0 4px;font-size:14px;color:var(--tx);font-weight:800;padding-left:10px;border-left:4px solid var(--hc,var(--tx))}
.dt ol{margin:2px 0 4px;padding-left:22px;line-height:1.7;font-size:15px}
.dt p{margin:2px 0;font-size:15px;line-height:1.7}
.tags span{display:inline-block;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut);padding:3px 10px;border-radius:10px;margin-right:5px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.sw small{display:block;color:var(--mut);font-weight:500;font-size:13px;margin-top:2px;line-height:1.5}
.sw input{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:#33433c;box-shadow:inset 0 0 0 1.5px rgba(242,239,228,.28);position:relative;flex:none;margin:0 0 0 12px;transition:.2s}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#f2efe4;transition:.2s}
.sw input:checked{background:var(--acc);box-shadow:none}
.sw input:checked::after{left:23px}
.btn2{display:block;width:100%;height:52px;border-radius:16px;background:var(--card2);font-weight:700;font-size:16px;margin-top:10px}
.btn2.main{background:var(--tx);color:var(--ink)}
.btn2.red{background:transparent;color:#ff8a9e;border:1.5px solid rgba(255,138,158,.45)}
.help{font-size:13.5px;color:var(--mut);line-height:1.75;margin-top:14px}
.help b{color:var(--tx)}
.ag{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px}
.ag .no{width:28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--num);flex:none}
.ag.cur .no{background:var(--acc);color:var(--ink)}
.ag.fin .no{background:var(--rest);color:var(--ink)}
.ag.skp .no{background:transparent;border:1.5px dashed var(--mut);color:var(--mut)}
.ag .nm{flex:1;min-width:0}.ag .nm b{display:block;font-size:16px}.ag .nm span{font-size:13px;color:var(--mut)}
.ag.skp .nm b{text-decoration:line-through;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 12px}
.cal div.fut{opacity:.35}.cal div.td{outline:2px solid var(--tx);outline-offset:-2px}.cal .pad{background:none!important;aspect-ratio:1}.cal .mo{grid-column:1/-1;aspect-ratio:auto;background:none;justify-content:start;font-size:12px;padding:4px 0 0}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:12px;color:var(--mut);font-family:var(--num)}
.cal div.on{background:var(--rest);color:var(--ink);font-weight:700}
.cal div.hd2{background:none;aspect-ratio:auto;font-size:12px}
.step{display:flex;align-items:center;gap:2px;flex:none}.row.ex .nm b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step button{width:40px;height:44px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px rgba(242,239,228,.22);font-size:20px;font-weight:700;color:var(--tx)}.step button[disabled]{opacity:.3}.step .st{background:none!important;min-height:44px;display:grid;place-items:center;border-radius:12px;min-width:52px;font-size:13px;padding:5px 6px;text-align:center}
.row.ex{padding:4px 6px 4px 4px}.row .nmb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:4px 8px;border-radius:12px}
.hrow{align-items:baseline;display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.hrow span:last-child{color:var(--mut);font-family:var(--num)}
.back{backdrop-filter:blur(6px)}.dlg{position:fixed;left:24px;right:24px;top:50%;max-width:420px;margin:0 auto;transform:translateY(-50%) scale(.95);background:var(--card2);border-radius:24px;padding:22px 18px 16px;z-index:22;opacity:0;pointer-events:none;visibility:hidden;transition:.2s;text-align:center}
.dlg.on{opacity:1;pointer-events:auto;transform:translateY(-50%);visibility:visible}
.dlg b{font-size:19px;font-weight:800}.dlg p{color:var(--mut);margin:8px 0 6px;font-size:14.5px;line-height:1.6}
@media (orientation:landscape) and (max-height:520px){
.rmid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;align-content:center;align-items:center;gap:6px 18px;padding:0 20px}
.rmid .ringw{grid-column:1;grid-row:1/4;width:min(62vh,100%);justify-self:center}
.rmid>div:not(.ringw):not(.next){grid-column:2}
.rmid .next{grid-column:2}
.digits small{font-size:13px}}
@media (max-height:700px){.exn{min-height:0}.setinfo{min-height:0}.theme{padding:14px 16px 12px}.theme .t{font-size:22px}.days .day{height:52px}}
@media (min-width:700px){body{background:radial-gradient(60% 80% at 50% 0%,#12382b,transparent),var(--bg)}
.view{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.startbar,.sheet,.toast{max-width:520px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body>
<div class="sr" aria-live="polite" id="live"></div>

<!-- Home -->
<section id="home" class="view on" aria-label="ホーム">
  <div class="scroll" id="homeScroll">
    <div class="top">
      <div class="logo"><span id="logoMark"></span><span>SMASH <b>TIMER</b></span></div>
      <div class="tb">
        <button class="iconbtn" id="btnHist" aria-label="記録"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
        <button class="iconbtn" id="btnSet" aria-label="設定"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div id="resume"></div>
    <div class="days" id="days" role="group" aria-label="曜日"></div>
    <div class="theme" id="theme"></div>
    <div class="sec">場所</div>
    <div class="seg" id="place" role="group" aria-label="場所"></div>
    <div class="sec">レベル(セット数)</div>
    <div class="lv" id="lv" role="group" aria-label="レベル"></div>
    <div class="sec">今日のメニュー</div>
    <div id="menu"></div>
    <div class="week" id="week"></div>
  </div>
  <div class="startbar"><button class="go" id="btnGo"></button></div>
</section>

<!-- Run -->
<section id="run" class="view" data-phase="prep" aria-label="トレーニング実行中">
  <div class="rtop">
    <button class="iconbtn" id="btnClose" aria-label="中断する"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="prog">
      <div class="bar"><i id="pbar"></i></div>
      <div class="tm"><span id="tmL">0:00</span><span id="grpN"></span><span id="tmR">残り 0:00</span></div>
    </div>
    <button class="iconbtn" id="btnAg" aria-label="種目の一覧"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
  </div>
  <div class="rmid">
    <div>
      <div class="pill" id="pill">準備</div>
    </div>
    <div>
      <div class="exn" id="exn"></div>
      <div class="setinfo"><div class="r1"><span class="side" id="side" hidden></span><span id="setinfo"></span></div><span class="xi" id="xinfo"></span></div>
    </div>
    <div class="ringw" id="ringw" role="button" tabindex="0" aria-label="タップで一時停止/再開">
      <svg viewBox="0 0 300 300"><circle class="trk" cx="150" cy="150" r="132" fill="none" stroke-width="14"/><circle class="pg" id="ring" cx="150" cy="150" r="132" fill="none" stroke-width="14" stroke-dasharray="829.38" stroke-dashoffset="0"/></svg>
      <div class="digits"><b id="dig">10</b><small id="cue"></small></div>
    </div>
    <div class="next"><em>次</em><b id="nextT"></b></div>
  </div>
  <div class="xrow">
    <button class="chip" id="btnPlus" hidden>+15秒</button>
    <button class="chip" id="btnHow" hidden>やり方</button>
    <button class="chip" id="btnSkipEx">種目スキップ</button>
  </div>
  <div class="ctrl">
    <button class="cb" id="btnPrev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="cb main" id="btnPlay" aria-label="一時停止"></button>
    <button class="cb" id="btnNext" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
  </div>
</section>

<!-- Done -->
<section id="done" class="view" aria-label="完了">
  <div class="sh" id="doneMark"></div>
  <h1 id="doneH">おつかれさま!</h1>
  <p id="doneMsg"></p>
  <div class="stats">
    <div><b id="sTime">0</b><span>分</span></div>
    <div><b id="sEx">0</b><span>種目</span></div>
    <div><b id="sSet">0</b><span>セット</span></div>
  </div>

  <button class="go" id="btnHome" style="max-width:420px;pointer-events:auto">ホームへ戻る</button>
</section>

<div class="toast" id="toast"><span id="toastT"></span><button id="toastB">更新</button></div>
<div class="back" id="back"></div>
<div class="sheet" id="sheetDetail" role="dialog" aria-modal="true" aria-labelledby="dTitle" inert>
  <div class="hd"><b id="dTitle"></b><div style="display:flex;align-items:center"><span class="live" id="dLive" hidden></span><button class="iconbtn" id="dClose" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div class="bd dt" id="dBody"></div>
</div>
<div class="sheet" id="sheetSet" role="dialog" aria-modal="true" aria-labelledby="sTitle" inert>
  <div class="hd"><b id="sTitle">設定</b><button class="iconbtn" id="sClose" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="bd">
    <label class="sw"><div>ピッ音<small>切り替えと残り3秒に鳴ります</small></div><input type="checkbox" id="oSound"></label>
    <label class="sw"><div>音声ガイド<small>種目名・「スタート」「休憩」・残り10秒を読み上げ</small></div><input type="checkbox" id="oVoice"></label>
    <label class="sw"><div>バイブ<small>対応する端末のみ</small></div><input type="checkbox" id="oVib"></label>
    <label class="sw"><div>画面をつけたままにする<small>実行中にスリープしません</small></div><input type="checkbox" id="oWake"></label>
    <label class="sw"><div>マナーモード中も音を出す<small>iPhone用。オンにすると、他のアプリの音楽は止まります</small></div><input type="checkbox" id="oRinger"></label>
    <label class="sw"><div>ウォームアップを含める</div><input type="checkbox" id="oWarm"></label>
    <label class="sw"><div>ストレッチを含める</div><input type="checkbox" id="oCool"></label>
    <button class="btn2" id="btnTest">音を試す</button>
    <div class="help" id="help"></div>
  </div>
</div>
<div class="sheet" id="sheetAg" role="dialog" aria-modal="true" aria-labelledby="agTitle" inert>
  <div class="hd"><b id="agTitle">種目の一覧</b><button class="iconbtn" id="agClose" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="bd" id="agBody"></div>
</div>
<div class="sheet" id="sheetHist" role="dialog" aria-modal="true" aria-labelledby="hTitle" inert>
  <div class="hd"><b id="hTitle">記録</b><button class="iconbtn" id="hClose" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="bd" id="hBody"></div>
</div>
<div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" inert><b id="dlgT">中断しますか?</b><p id="dlgP"></p>

  <button class="btn2" id="dlgSave">ここまでを記録して終了</button>

const REST_DAYS = [0, 3, 5];

/** menu: [{key,label,items:[{id,sets}],pick,pickAll}] filtered by level/opts */
function getMenu(day, place, level, opts = {}) {
  const inc = { warm: true, cool: true, ...opts };
  const src = PLAN[day][place] || PLAN[day].home;
  const out = [];
  for (const g of src) {
    if (g.key === 'warm' && !inc.warm) continue;
    if (g.key === 'cool' && !inc.cool) continue;
    let items = [];
    for (const it of g.items) {
      if (it.min != null && level < it.min) continue;
      if (it.max != null && level > it.max) continue;
      const ov = (inc.ov || {})[it.id] || 0;
      items.push({ id: it.id, cap: LIB[it.id].cap || 8, base: it.sets[level], sets: Math.max(1, Math.min(LIB[it.id].cap || 8, it.sets[level] + (it.sets[level] > 1 || ov > 0 ? ov : 0))) });
    }
    const pickAll = g.pick ? items.map(i => i.id) : null;
    if (g.pick) {
      let pk = (inc.pick || []).filter(id => pickAll.includes(id));
      if (!pk.length) pk = [pickAll[0]];
      items = items.filter(i => pk.includes(i.id));
    }
    if (items.length) out.push({ key: g.key, label: g.label, items, pick: !!g.pick, pickAll });
  }
  return out;
}

const PREP_FIRST = 10, PREP_MAIN = 15, PREP_LIGHT = 5, SWITCH = 5;
const GEAR_OF = ids => [...new Set(ids.map(id => LIB[id].gear).filter(Boolean))];

function buildTimeline(menu) {
  const flat = [];
  menu.forEach(g => g.items.forEach(it => flat.push({ ...it, group: g.label, gkey: g.key })));
  const lightN = {}, lightI = {}, mainN = flat.filter(f => !LIB[f.id].light).length; let mainI = 0;
  flat.forEach(f => { if (LIB[f.id].light) lightN[f.gkey] = (lightN[f.gkey] || 0) + 1; });
  flat.forEach(f => { if (LIB[f.id].light) { lightI[f.gkey] = (lightI[f.gkey] || 0) + 1; f.gi = lightI[f.gkey]; f.gn = lightN[f.gkey]; } else { mainI++; f.gi = mainI; f.gn = mainN; } });
  const segs = [];
  const push = s => segs.push(s);
  flat.forEach((it, xi) => {
    const L = LIB[it.id];
    const nextIt = flat[xi + 1];
    // prep
    const prevL = xi > 0 ? LIB[flat[xi - 1].id] : null;
    let prep = xi === 0 ? PREP_FIRST : (L.light ? PREP_LIGHT : PREP_MAIN);
    if (prevL && !prevL.light && !L.light) prep = Math.min(120, Math.max(PREP_MAIN, L.r > 0 ? Math.min(prevL.r, L.r * 2) : prevL.r));   // 種目間の回復
    if (prevL && !prevL.light && L.light) prep = 10;
    const base = { light: L.light ? 1 : 0, how: L.how || '', card: L.card || 0, gkey: it.gkey, ex: it.id, name: L.n, amt: L.amt, cue: L.cue, xi, xn: flat.length, gi: it.gi, gn: it.gn, group: it.group, sets: it.sets };
    push({ ...base, type: 'prep', dur: prep, set: 1, side: null, long: xi > 0 && prep >= 40 });
    for (let s = 1; s <= it.sets; s++) {
      if (L.side) {
        push({ ...base, type: 'work', dur: L.w, set: s, side: '左' });
        push({ ...base, type: 'switch', dur: SWITCH, set: s, side: '右へ' });
        push({ ...base, type: 'work', dur: L.w, set: s, side: '右' });
      } else {
        push({ ...base, type: 'work', dur: L.w, set: s, side: null });
      }
      if (s < it.sets && L.r > 0) push({ ...base, type: 'rest', dur: L.r, set: s, side: null });
    }
  });
  // fill "next" labels
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    let n = segs[i + 1];
    if (!n) { s.next = 'おつかれさま!'; continue; }
    s.next = nextLabel(n, s);
  }
  const total = segs.reduce((a, s) => a + s.dur, 0);
  return { segs, total, count: flat.length };
}

function nextLabel(n, cur) {
  if (n.type === 'prep') return `${n.name}`;
  if (n.type === 'work') {
    if (cur.type === 'prep') return `運動 ${n.dur}秒` + (n.sets > 1 ? ` ・ ${n.sets}セット` : '') + (n.side ? ' ・ 左右' : '');
    if (cur.type === 'switch') return `${n.name}(右) ${n.dur}秒`;
    return `${n.name} ${n.set}/${n.sets}セット`;
  }
  if (n.type === 'rest') return `休憩 ${n.dur}秒`;
  return `反対側へ ${n.dur}秒`;
}

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function estMinutes(day, place, level, opts) {
  return Math.round(buildTimeline(getMenu(day, place, level, opts)).total / 60);
}

/** Timer runner with injectable clock. events: {type:'seg'|'count'|'warn'|'done'} */
class Runner {
  constructor(segs, now) {
    this.segs = segs.map(s => ({ ...s }));
    this.base = this.segs.map(s => s.dur);
    this.now = now || (() => Date.now());
    this.i = 0; this.acc = 0; this.t0 = 0; this.running = false; this.done = false;
    this._beep = null; this._warn = false; this.started = false;
    this.keys = new Set(); this.actMs = 0; this.skipped = new Set(); this._last = 0;
  }
  get sets() { return this.keys.size; }
  get finished() { const c = {}; this.keys.forEach(k => { const x = +k.split(':')[0]; c[x] = (c[x] || 0) + 1; }); const f = new Set(); this.segs.forEach(s => { if (s.type === 'work' && c[s.xi] >= s.sets) f.add(s.xi); }); return f; }
  seg() { return this.segs[this.i]; }
  elapsed() { return this.acc + (this.running ? this.now() - this.t0 : 0); }
  remainingMs() { return Math.max(0, this.seg().dur * 1000 - this.elapsed()); }
  totalMs() { return this.segs.reduce((a, s) => a + s.dur * 1000, 0); }
  doneMs() { let a = 0; for (let k = 0; k < this.i; k++) a += this.segs[k].dur * 1000; return a + Math.min(this.elapsed(), this.seg().dur * 1000); }
  _tickAct() { const t = this.now(); if (this.running && this._last) this.actMs += Math.min(1500, t - this._last); this._last = this.running ? t : 0; }
  start() { if (!this.running && !this.done) { this.t0 = this.now(); this.running = true; this.started = true; this._last = this.t0; } }
  pause() { if (this.running) { this._tickAct(); this.acc += this.now() - this.t0; this.running = false; this._last = 0; } }
  toggle() { this.running ? this.pause() : this.start(); }
  _goto(j, over, natural) {
    const prev = this.segs[this.i];
    if (prev && prev.type === 'work' && !prev.light && (!prev.side || prev.side === '右') && (natural || this.elapsed() >= prev.dur * 500) && j > this.i) this.keys.add(prev.xi + ':' + prev.set);
    this._beep = null; this._warn = false;
    if (j >= this.segs.length) { this.done = true; this.running = false; this.i = this.segs.length - 1; this.acc = this.seg().dur * 1000; return; }
    this.i = Math.max(0, j); this.acc = over || 0; this.t0 = this.now();
  }
  skip() { this._goto(this.i + 1, 0, false); return [this.done ? { type: 'done' } : { type: 'seg', seg: this.seg() }]; }
  back() {
    if (this.elapsed() > 3000 || this.i === 0) this._goto(this.i, 0); else this._goto(this.i - 1, 0);
    this.skipped.delete(this.seg().xi);
    return [{ type: 'seg', seg: this.seg() }];
  }
  /** この種目を飛ばして次の種目の準備へ */
  skipExercise() {
    const xi = this.seg().xi;
    if (!this.finished.has(xi)) this.skipped.add(xi);
    let j = this.segs.findIndex((s, k) => k > this.i && s.xi > xi);
    if (j < 0) { this._goto(this.segs.length, 0); return [{ type: 'done' }]; }
    this._goto(j, 0, false); return [{ type: 'seg', seg: this.seg() }];
  }
  jumpTo(xi) {
    const j = this.segs.findIndex(s => s.xi === xi);
    if (j < 0) return [];
    const cur = this.seg().xi, fin = this.finished;
    for (let x = cur; x < xi; x++) if (!fin.has(x)) this.skipped.add(x);
    this.skipped.delete(xi);
    this._goto(j, 0, false); return [{ type: 'seg', seg: this.seg() }];
  }
  addTime(sec) { this.segs[this.i].dur += sec; this._warn = false; }
  plannedSets() { const m = {}; this.segs.forEach(s => { if (s.type === 'work' && !s.light && s.set === s.sets && (!s.side || s.side === '右')) m[s.xi] = s.sets; }); return Object.values(m).reduce((a, b) => a + b, 0); }
  exercises() {
    const out = [];
    this.segs.forEach(s => { if (!out[s.xi]) out[s.xi] = { xi: s.xi, ex: s.ex, name: s.name, sets: s.sets, group: s.group, gkey: s.gkey, card: s.card, light: s.light }; });
    return out;
  }
  snapshot() { return { i: this.i, el: Math.round(this.elapsed()), add: this.segs.map((s, k) => s.dur - this.base[k]), keys: [...this.keys], actMs: Math.round(this.actMs), skipped: [...this.skipped] }; }
  restore(sn) {
    this.i = Math.min(sn.i, this.segs.length - 1); this.acc = sn.el; this.running = false;
    (sn.add || []).forEach((d, k) => { if (this.segs[k]) this.segs[k].dur += d; });
    this.keys = new Set(sn.keys || []); this.actMs = sn.actMs || 0; this.skipped = new Set(sn.skipped || []);
  }
  tick() {
    const ev = [];
    if (this.done || !this.running) return ev;
    this._tickAct();
    let changed = false;
    while (!this.done && this.elapsed() >= this.seg().dur * 1000) {
      const over = this.elapsed() - this.seg().dur * 1000;
      this._goto(this.i + 1, over, true);
      changed = true;
    }
    if (this.done) { ev.push({ type: 'done' }); return ev; }
    if (changed) ev.push({ type: 'seg', seg: this.seg() });
    const s = this.seg();
    const sec = Math.ceil(this.remainingMs() / 1000);
    if (s.dur > 4 && sec >= 1 && sec <= 3 && this._beep !== sec) { this._beep = sec; ev.push({ type: 'count', n: sec }); }
    if ((s.type === 'rest' || s.type === 'prep') && s.dur >= 25 && sec <= 10 && sec > 3 && !this._warn) { this._warn = true; ev.push({ type: 'warn', n: 10 }); }
    return ev;
  }
}

if (typeof module !== 'undefined') module.exports = { GEAR_OF, LEVELS, DAYS, LIB, PLAN, REST_DAYS, getMenu, buildTimeline, fmt, estMinutes, Runner, PREP_FIRST };

y1=\"77.4\" x2=\"104.6\" y2=\"75.1\" stroke=\"#c5ccd6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><ellipse cx=\"115.9\" cy=\"73.1\" rx=\"7.2\" ry=\"11.6\" transform=\"rotate(80 115.9 73.1)\" fill=\"#ffffff\" fill-opacity=\"0.6\" stroke=\"#1b2a44\" stroke-width=\"2.2\"/><g transform=\"rotate(80 115.9 73.1)\" stroke=\"#3d4452\" stroke-opacity=\"0.4\" stroke-width=\"0.6\"><line x1=\"111.4\" y1=\"62.6\" x2=\"111.4\" y2=\"83.6\"/><line x1=\"114.4\" y1=\"62.6\" x2=\"114.4\" y2=\"83.6\"/><line x1=\"117.4\" y1=\"62.6\" x2=\"117.4\" y2=\"83.6\"/><line x1=\"120.4\" y1=\"62.6\" x2=\"120.4\" y2=\"83.6\"/><line x1=\"109.5\" y1=\"66.1\" x2=\"122.3\" y2=\"66.1\"/><line x1=\"109.5\" y1=\"69.6\" x2=\"122.3\" y2=\"69.6\"/><line x1=\"109.5\" y1=\"73.1\" x2=\"122.3\" y2=\"73.1\"/><line x1=\"109.5\" y1=\"76.6\" x2=\"122.3\" y2=\"76.6\"/><line x1=\"109.5\" y1=\"80.1\" x2=\"122.3\" y2=\"80.1\"/><\/g><rect x=\"15.2\" y=\"-34.5\" width=\"77.6\" height=\"19.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1c7c54\" stroke-width=\"1.2\"/><text x=\"54.0\" y=\"-20.0\" font-size=\"13.0\" fill=\"#1c7c54\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Noto Sans CJK JP, sans-serif\">左足で着地<\/text><rect x=\"4.2\" y=\"-12.5\" width=\"118.2\" height=\"19.0\" rx=\"4\" fill=\"#ffffff\" stroke=\"#1c7c54\" stroke-width=\"1.2\"/><text x=\"63.3\" y=\"2.0\" font-size=\"13.0\" fill=\"#1c7c54\" text-anchor=\"middle\" font-weight=\"bold\" font-family=\"Noto Sans CJK JP, sans-serif\">ラケットは胸の前<\/text><\/g><\/svg>","④ 左足で着地(右はつま先だけ)<br>ラケットを胸の前へ戻して次へ"]],"steps":["<b>構え:<\/b> スプリットステップのあと、利き腕の肘を高く上げて胸を張る。反対の手でシャトルの方向を指す。","<b>踏み切り:<\/b> 床を強く蹴って真上〜やや後ろへ。胸を軽く反らして「ため」をつくる。","<b>空中・インパクト:<\/b> 反りから腰→胸→腕の順に回して、最高点付近でシャトルを捉える。反対の腕は体に引き寄せてバランスをとる。","<b>着地:<\/b> 膝を曲げて衝撃を吸収し、すぐ次の構えへ戻る(体幹と脚の筋力が効く)。"],"dose":"①シャドー(シャトルなし)で動きを確認 → ②ノックで「ジャンプ→打つ」だけ反復 → ③ゲーム形式。1回ごとに質を優先し、疲れたら中止。","tip":"高く跳ぶだけでなく「最高点付近で打つ」タイミングを合わせると、速い球につながります。","ng":""}};
</script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SHUTTLE = `<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(38 32 32)"><path d="M27 41 L21 17 Q32 14 43 17 L37 41Z" fill="#f2efe4"/><path d="M30 41 L27 16M32 41V15M34 41L37 16" stroke="#9a937d" stroke-width="1.2" fill="none" opacity=".6"/><ellipse cx="32" cy="17" rx="11" ry="2.6" fill="none" stroke="#ff6b35" stroke-width="2.2"/><circle cx="32" cy="46" r="6" fill="#ff6b35"/></g></svg>`;
const IC_HOME = '<svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9M10 19v-5h4v5"/></svg>';
const IC_OUT = '<svg class="i" viewBox="0 0 24 24"><path d="M3 19h18M5 19l4-8 3 5 3-6 4 9"/><circle cx="17" cy="6" r="2"/></svg>';
const IC_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>';
const IC_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>';
$('#logoMark').innerHTML = SHUTTLE; $('#doneMark').innerHTML = SHUTTLE;

let ST = Object.assign({sound:true, voice:true, vib:true, wake:true, ringer:false, warm:true, cool:true}, store.get('st_v1', {}));
let SEL = Object.assign({place:'home', level:1, pick:[]}, store.get('sel_v1', {}));
if(!(SEL.level>=0 && SEL.level<=2)) SEL.level = 1;
if(SEL.place !== 'home' && SEL.place !== 'out') SEL.place = 'home';
if(!Array.isArray(SEL.pick)) SEL.pick = [];
SEL.day = new Date().getDay();
let HIST = store.get('hist_v1', []);
if(!Array.isArray(HIST)) HIST = [];
HIST = HIST.filter(h => h && typeof h.ts === 'number');
const saveSel = () => store.set('sel_v1', {place:SEL.place, level:SEL.level, pick:SEL.pick});

const ORDER = [1,2,3,4,5,6,0];
const GL = {warm:'ウォームアップ', cool:'ストレッチ', rest:'回復'};
const PH = {prep:'準備', work:'運動', rest:'休憩', 'switch':'反対側', light:'運動'};
let OV = store.get('ov_v1', {}); if(!OV || typeof OV!=='object') OV = {};
function ovDay(){ const o = {}; Object.keys(OV).forEach(k => { const [d,id] = k.split(':'); if(+d === SEL.day) o[id] = OV[k]; }); return o; }
function opts(){ return {warm: ST.warm, cool: ST.cool, pick: SEL.pick, ov: ovDay()}; }
function menu(){ return getMenu(SEL.day, SEL.place, SEL.level, opts()); }
const allIds = m => m.flatMap(g => g.items.map(i => i.id));

/* ---------------- Home ---------------- */
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); }
function doneDays(){ const ws = weekStart(), s = new Set(); HIST.forEach(h => { if(h.ts >= ws && !h.partial) s.add(typeof h.day === 'number' ? h.day : new Date(h.ts).getDay()); }); return s; }

function renderHome(){
  const today = new Date().getDay(), dd = doneDays();
  const P = PLAN[SEL.day];
  document.documentElement.style.setProperty('--day', P.color);
  $('#days').innerHTML = ORDER.map(d => `<button class="day ${d===today?'today':''} ${dd.has(d)?'done':''}" data-d="${d}" aria-pressed="${d===SEL.day}" aria-label="${DAYS[d]}曜日${d===today?'(今日)':''}${dd.has(d)?'・今週実施済み':''}"><span>${DAYS[d]}</span><i></i></button>`).join('');
  const rest = REST_DAYS.includes(SEL.day);
  const m = menu();
  const gear = GEAR_OF(allIds(m));
  $('#theme').innerHTML = `<div class="k">${DAYS[SEL.day]}曜日</div><div class="t">${P.theme}</div><div class="n">${P.note || (rest ? '回復を優先する日。軽いストレッチだけでもOKです。' : '')}</div>${gear.length ? `<div class="g">道具: ${gear.map((g,i,a) => `<span style="white-space:nowrap">${g}${i<a.length-1?" ・":""}</span>`).join(" ")}</div>` : ''}`;
  $('#place').innerHTML = [['home',IC_HOME,'家','自宅・狭い場所'],['out',IC_OUT,'外','体育館・公園']].map(([k,ic,t,s]) => `<button data-p="${k}" aria-pressed="${SEL.place===k}">${ic}<span>${t}<small>${s}</small></span></button>`).join('');
  $('#lv').innerHTML = LEVELS.map((n,i) => `<button data-l="${i}" aria-pressed="${SEL.level===i}" aria-label="レベル${n}、約${estMinutes(SEL.day, SEL.place, i, opts())}分"><div class="l">${n}</div><div class="m">約${estMinutes(SEL.day, SEL.place, i, opts())}分</div></button>`).join('');
  let h = '';
  if(!m.length){
    h = `<div class="empty"><b>メニューがありません</b>設定でウォームアップかストレッチをオンにしてください。</div>`;
  }
  m.forEach(g => {
    const light = g.key==='warm' || g.key==='cool';
    const secs = buildTimeline([g]).total;
    h += `<div class="grp"><h4>${g.label}<em>${light ? g.items.length+'種目 ・ ' : ''}約${Math.max(1,Math.round(secs/60))}分</em></h4>`;
    if(g.pick){
      h += `<div class="picks" role="group" aria-label="やる種目を選ぶ">${g.pickAll.map(id => `<button class="pk" data-pick="${id}" aria-pressed="${g.items.some(i => i.id===id)}">${LIB[id].n}</button>`).join('')}</div>`;
    }
    if(light){
      h += `<div class="row plain"><span>${g.items.map(i => LIB[i.id].n).join(' → ')}</span></div>`;
    } else {
      g.items.forEach(i => {
        const L = LIB[i.id], one = i.base <= 1;
        h += `<div class="row ex"><button class="nmb" data-ex="${i.id}" aria-label="${L.n}。やり方を見る"><div class="nm"><b>${L.n}</b><span>${L.amt}${L.side?'・左右':''}</span></div><div class="q" aria-hidden="true">?</div></button><div class="step">${one ? '' : `<button data-ov="-1" data-id="${i.id}" aria-label="${L.n}のセットを減らす" ${i.sets<=1?'disabled':''}><svg viewBox="0 0 24 24" class="i"><path d="M6 12h12"/></svg></button>`}<span class="st" aria-live="polite" aria-label="${i.sets}セット">${one?'1セット':i.sets+'セット'}</span>${one ? '' : `<button data-ov="1" data-id="${i.id}" aria-label="${L.n}のセットを増やす" ${i.sets>=i.cap?'disabled':''}><svg viewBox="0 0 24 24" class="i"><path d="M6 12h12M12 6v12"/></svg></button>`}</div></div>`;
      });
    }
    h += '</div>';
  });
  if(Object.keys(ovDay()).length) h += `<button class="btn2" id="ovReset">セット数を元に戻す</button>`;
  $('#menu').innerHTML = h;
  const tot = m.length ? estMinutes(SEL.day, SEL.place, SEL.level, opts()) : 0;
  const go = $('#btnGo');
  go.disabled = !m.length;
  go.innerHTML = m.length ? `<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>スタート<small>約${tot}分</small>` : 'スタートできません';
  const n = HIST.filter(x => x.ts >= weekStart() && !x.partial && !x.rec).length;
  let wt = n ? `今週 ${n}回 完了` : 'まだ今週の記録はありません。';
  const rp = HIST.filter(x => !x.partial && !x.rec && x.rpe).slice(-2);
  if(rp.length===2 && rp.every(x => x.rpe===3 && typeof x.level==='number' && SEL.level>=x.level) && SEL.level>0) wt += '\nきつい日が続いています。レベルを一つ下げても大丈夫です。';
  else if(rp.length===2 && rp.every(x => x.rpe===1 && typeof x.level==='number' && SEL.level<=x.level) && SEL.level<2) wt += '\nラクな日が続いています。レベルを一つ上げてみましょう。';
  if(!('wakeLock' in navigator)) wt += '\nこの端末は画面の常時点灯に未対応です。設定でスリープ時間を長くしてください。';
  if(/iPhone|iPad/.test(navigator.userAgent) && !ST.ringer && !store.get('hint_ring', false)) wt += '\nマナーモード中は音が出ません。設定で変更できます。';
  $('#week').textContent = wt;
  renderResume();
}

function renderResume(){
  const r = store.get('run_v1', null), el = $('#resume');
  if(!r || !r.ctx || !r.snap || Date.now() - r.ts > 12*3600*1000 || R){ el.innerHTML = ''; return; }
  let tl; try{ tl = buildTimeline(getMenu(r.ctx.day, r.ctx.place, r.ctx.level, r.ctx.o)); }catch(e){ el.innerHTML=''; return; }
  if(r.ctx.sig && r.ctx.sig !== sigOf(tl)){ store.del('run_v1'); el.innerHTML=''; return; }
  const seg = tl.segs[Math.min(r.snap.i, tl.segs.length-1)];
  if(!seg){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="resume"><b>前回の続きがあります</b><p>${DAYS[r.ctx.day]}曜・${r.ctx.place==='home'?'家':'外'}・${LEVELS[r.ctx.level]}　/　${seg.name}(${seg.xi+1}/${seg.xn}種目)から</p><div class="two"><button class="btn2 main" id="rsGo" style="margin:0">続きから再開</button><button class="btn2" id="rsNo" style="margin:0">破棄</button></div></div>`;
  $('#rsGo').onclick = () => startRun(r);
  $('#rsNo').onclick = () => { store.del('run_v1'); renderResume(); };
}

$('#days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if(!b) return; SEL.day = +b.dataset.d; renderHome(); });
$('#place').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if(!b) return; SEL.place = b.dataset.p; saveSel(); renderHome(); });
$('#lv').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if(!b) return; SEL.level = +b.dataset.l; saveSel(); renderHome(); });
$('#menu').addEventListener('click', e => {
  if(e.target.closest('#ovReset')){ Object.keys(OV).forEach(k => { if(k.startsWith(SEL.day+':')) delete OV[k]; }); store.set('ov_v1', OV); renderHome(); return; }
  const pk = e.target.closest('[data-pick]');
  if(pk){
    const id = pk.dataset.pick;
    let next = allIds(menu()).filter(x => getMenu(SEL.day, SEL.place, SEL.level, {warm:true,cool:true}).some(g => g.pickAll && g.pickAll.includes(x)));
    next = next.includes(id) ? next.filter(x => x!==id) : next.concat(id);
    if(!next.length) return;
    SEL.pick = next; saveSel(); renderHome(); return;
  }
  const ov = e.target.closest('[data-ov]');
  if(ov){ const id = ov.dataset.id, k = SEL.day + ':' + id; OV[k] = (OV[k]||0) + +ov.dataset.ov; if(!OV[k]) delete OV[k]; store.set('ov_v1', OV); const y = $('#homeScroll').scrollTop; renderHome(); $('#homeScroll').scrollTop = y; const nb = document.querySelector(`[data-ov="${ov.dataset.ov}"][data-id="${id}"]`); if(nb && !nb.disabled) nb.focus({preventScroll:true}); return; }
  const b = e.target.closest('[data-ex]'); if(b) openDetail(b.dataset.ex);
});

/* ---------------- Sheets ---------------- */
let openSheet = null, lastFocus = null;
function showSheet(el){
  closeSheets(true); openSheet = el; lastFocus = document.activeElement;
  $('#back').classList.add('on'); el.inert = false; el.classList.add('on'); document.querySelectorAll('.view').forEach(v => v.inert = true);
  const f = el.querySelector('button'); if(f) setTimeout(() => { try{ f.focus({preventScroll:true}); }catch(e){} }, 60);
}
function closeSheets(silent){
  document.querySelectorAll('.sheet,.dlg').forEach(x => { x.classList.remove('on'); x.inert = true; x.style.transform = ''; });
  $('#back').classList.remove('on'); openSheet = null; document.querySelectorAll('.view').forEach(v => v.inert = false);
  if(!silent && lastFocus){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
}
$('#back').addEventListener('click', () => { if(openSheet === $('#dlg')) return; closeSheets(); });
['#dClose','#sClose','#agClose','#hClose'].forEach(s => $(s).onclick = () => closeSheets());
document.querySelectorAll('.sheet .hd').forEach(hd => {
  const sh = hd.parentElement; let y0 = null;
  hd.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; sh.style.transition = 'none'; }, {passive:true});
  hd.addEventListener('touchmove', e => { if(y0 === null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  hd.addEventListener('touchend', e => { if(y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transition = ''; if(dy > 80) closeSheets(); else sh.style.transform = ''; });
});

function openDetail(id){
  const L = LIB[id]; if(!L) return;
  const D = L.card ? DETAIL[L.card] : null;
  $('#dTitle').textContent = L.n; $('#dLive').hidden = true;
  let h = '';
  if(D){
    h += `<div class="tags" style="margin-bottom:10px">${(D.tags||[]).map(t => `<span>${t}</span>`).join('')}</div>`;
    const n = D.frames.length;
    h += `<div class="paper"><div class="figs ${n===1?'one':''}" id="figs">${D.frames.map(f => `<div>${f[0]}<div class="cap">${f[1]}</div></div>`).join('')}</div></div>`;

function renderHist(){
  const ws = weekStart(), start = ws - 21*86400000, days = new Set();
  HIST.forEach(h => { if(!h.partial){ const d = new Date(h.ts); d.setHours(0,0,0,0); days.add(d.getTime()); } });
  let cal = ['月','火','水','木','金','土','日'].map(x => `<div class="hd2">${x}</div>`).join('');
  const td0 = new Date(); td0.setHours(0,0,0,0); let lastM = -1;
  for(let i=0;i<28;i++){ const t = new Date(start + i*86400000); t.setHours(0,0,0,0); const on = days.has(t.getTime());
    if(t.getMonth() !== lastM){ lastM = t.getMonth(); if(i===0 || t.getDate()<=7){ cal += `<div class="mo">${t.getMonth()+1}月</div>` + '<div class="pad"></div>'.repeat((t.getDay()+6)%7); } }
    const tt = t.getTime(); cal += `<div class="${on?'on':''} ${tt>td0.getTime()?'fut':''} ${tt===td0.getTime()?'td':''}">${t.getDate()}</div>`; }
  const full = HIST.filter(h => !h.partial && !h.rec);

  let streak = 0, t = ws; if(!wk[t]) t -= 7*86400000; while(wk[t]){ streak++; t -= 7*86400000; }
  const recent = HIST.slice(-6).reverse().map(h => { const d = new Date(h.ts); return `<div class="hrow"><span>${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]}) ${DAYS[typeof h.day==='number'?h.day:d.getDay()]}曜メニュー・${h.place==='out'?'外':'家'}・${LEVELS[h.level]||''}${h.partial?'(途中まで)':''}${h.rec?(PLAN[h.day] && PLAN[h.day].rec ? '・回復' : '・ストレッチ'):''}</span><span>${Math.max(1,Math.round((h.sec||0)/60))}分 ・ ${h.rec ? (h.ex||0)+'種目' : (h.sets||0)+'セット'}</span></div>`; }).join('');

}

let AC = null, silent = null;
function silentWav(){
  const sr = 8000, n = sr/2, b = new Uint8Array(44 + n), dv = new DataView(b.buffer);
  const w = (o,s) => { for(let i=0;i<s.length;i++) b[o+i] = s.charCodeAt(i); };
  w(0,'RIFF'); dv.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true); w(36,'data'); dv.setUint32(40,n,true);
  b.fill(128,44);
  return URL.createObjectURL(new Blob([b], {type:'audio/wav'}));
}
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type = ST.ringer ? 'playback' : 'ambient'; }catch(e){}
  try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){}
  if(ST.ringer && !navigator.audioSession){ try{ if(!silent){ silent = new Audio(silentWav()); silent.loop = true; } silent.play().catch(()=>{}); }catch(e){} }
}
function stopSilent(){ try{ silent && silent.pause(); }catch(e){} }
function beep(freq, dur, when, vol){
  if(!AC) return;
  try{
    const t = AC.currentTime + (when||0), o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.5, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function speak(t){
  if(!ST.voice || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 1.1; speechSynthesis.speak(u); }catch(e){}
}
function vib(p){ if(ST.vib && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
let WL = null;
async function wake(){

}

function cueSeg(s){

  if(s.type==='prep' && s.long) return '休憩';

function startRun(resume){
  const ctx = resume ? resume.ctx : {day:SEL.day, place:SEL.place, level:SEL.level, o:opts()};
  const tl = buildTimeline(getMenu(ctx.day, ctx.place, ctx.level, ctx.o));

  if(cache.dig !== dg){ cache.dig = dg; const d = $('#dig'); d.textContent = dg; d.classList.toggle('long', dg.length > 2); if(sec<=3 && s.dur>4){ d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); } }

}

let hadCtl = false, updPending = false;
function showToastQ(){ $('#toast').classList.toggle('on', updPending && !R && $('#home').classList.contains('on')); }
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => { swReady = true; try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadCtl){ hadCtl = true; return; }
    updPending = true; showToastQ();
  });
  $('#toastB').onclick = () => { if(R){ return; } location.reload(); };
  $('#toastT').textContent = '新しいバージョンがあります';
}
window.__app = {get R(){ return R; }, SEL, ST, get HIST(){ return HIST; }};
renderHome();
})();
